# GitVersion computes the firmware version from git history (GitFlow):
#   master  -> x.y.z            (clean stable; each release bumps the PATCH)
#   develop -> x.y.z-alpha.N    (prerelease previews of the next release)
# Override a bump with a "+semver: minor" (or "+semver: major") commit message.
# The `main` branch config also matches `master`.
workflow: GitFlow/v1
next-version: 0.1.0
branches:
  main:
    increment: Patch
  develop:
    increment: Patch
    label: alpha
