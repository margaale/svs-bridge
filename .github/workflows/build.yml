# Builds the bridge and runs the host tests; the images are kept as artifacts, one file each (not
# zipped). GitVersion (GitVersion.yml) gives the version. A push to master is a release (vX.Y.Z,
# tagged, with the images); develop (X.Y.Z-alpha.N) and pull requests only build: tags are master's.
# Same scheme as Cruller (margaale/Cruller .github/workflows/build.yml).
name: build

on:
  push:
    branches: [master, develop] # pull requests build through pull_request (one run per push, not two)
  pull_request:
  workflow_dispatch:

env:
  ESP_IDF_VERSION: "v6.1"
  GITVERSION_VERSION: "6.x"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      # master: X.Y.Z, a release; develop: X.Y.Z-alpha.N; pull requests: X.Y.Z-pr.N, where N is this
      # run's number (GitVersion.yml gives X.Y.Z and the label). The run number grows with every run
      # of this workflow, so the newest build is the newest version whatever its branch: squash
      # merges leave no commit count to compare.
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GitVersion reads the tags and the history
      - uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: ${{ env.GITVERSION_VERSION }}
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v4
      - id: version
        env:
          CORE: ${{ steps.gitversion.outputs.majorMinorPatch }}
          LABEL: ${{ steps.gitversion.outputs.preReleaseLabel }}
          RELEASE: ${{ github.ref == 'refs/heads/master' }}
        run: |
          if [ "$RELEASE" = true ] || [ -z "$LABEL" ]; then v="$CORE"; else v="$CORE-$LABEL.$GITHUB_RUN_NUMBER"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "SVS Bridge $v (build $GITHUB_RUN_NUMBER)"

  # src/core's pure logic (reset-vector patch, Intel HEX decoder, SVS line parsing), on the host.
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/run.sh

  # Espressif ESP32 boards: ESP-IDF in Espressif's container, target src/platform/esp32.
  esp32:
    needs: version
    runs-on: ubuntu-24.04
    env:
      BOARD: esp32s3_n16r8
    steps:
      - uses: actions/checkout@v7

      # ESP-IDF compiles through ccache: keep its directory between runs (inside the workspace, which
      # the container mounts), so only what changed is compiled again.
      - name: ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-esp32s3-${{ env.ESP_IDF_VERSION }}-${{ github.sha }}
          restore-keys: ccache-esp32s3-${{ env.ESP_IDF_VERSION }}-

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: esp32s3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache -e IDF_CCACHE_ENABLE=1
            -e SVS_BRIDGE_VERSION=${{ needs.version.outputs.version }}
          command: bash scripts/build.sh esp32 && ccache -s

      # Named as released: svs-bridge-<version>-<board>-<file>.
      - name: Name the images
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir dist
          for f in build/esp32/svs_bridge.bin build/esp32/svs_bridge-factory.bin build/esp32/bootloader/bootloader.bin \
                   build/esp32/partition_table/partition-table.bin build/esp32/ota_data_initial.bin; do
            cp "$f" "dist/svs-bridge-${VERSION}-${BOARD}-$(basename "$f")"
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          path: dist/svs-bridge-${{ needs.version.outputs.version }}-${{ env.BOARD }}-svs_bridge.bin
          archive: false # the image itself, not a zip: the artifact takes the file's name
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/svs-bridge-${{ needs.version.outputs.version }}-${{ env.BOARD }}-svs_bridge-factory.bin
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/svs-bridge-${{ needs.version.outputs.version }}-${{ env.BOARD }}-bootloader.bin
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/svs-bridge-${{ needs.version.outputs.version }}-${{ env.BOARD }}-partition-table.bin
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/svs-bridge-${{ needs.version.outputs.version }}-${{ env.BOARD }}-ota_data_initial.bin
          archive: false
          if-no-files-found: error

  # Every push to master: tag vX.Y.Z and a GitHub release with the images. Only master is tagged:
  # develop's builds keep their images on the run, as pull requests do.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [version, tests, esp32]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: svs-bridge-*
          path: release
          merge-multiple: true # every image in one place, already named
      # Bridges on 0.1.x look for an asset named exactly svs_bridge.bin to update from GitHub: keep
      # one on each release so they can reach this version.
      - run: |
          cp release/svs-bridge-*-svs_bridge.bin release/svs_bridge.bin
          ls -l release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SVS Bridge ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
