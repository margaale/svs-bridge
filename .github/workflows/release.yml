name: Release

# develop -> alpha pre-release, master -> stable release. The version is
# computed by GitVersion (see GitVersion.yml), so no manual version bump.
on:
  push:
    branches: [master, develop]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # GitVersion needs the full history

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'
      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      # Clean x.y.z on master; x.y.z-alpha.N on develop.
      - name: Pick version
        id: ver
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            echo "version=${{ steps.gitversion.outputs.semVer }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.gitversion.outputs.majorMinorPatch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set firmware version
        run: echo "${{ steps.ver.outputs.version }}" > version.txt

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: '.'

      # svs_bridge.bin is the OTA image; the other three are for a full flash.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          prerelease: ${{ github.ref_name == 'develop' }}
          generate_release_notes: true
          files: |
            build/svs_bridge.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
